name: Build desktop apps

# Pull requests get the cheap check job; merges to main get the full
# three-platform build. Can also be started by hand from the Actions tab.
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Pushing twice in quick succession shouldn't leave two runs racing to
# finish: the newer commit cancels the older run rather than both burning
# minutes on a result nobody will look at.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Pull requests only compile-check on Linux. Private-repo minutes bill at
  # 1x on Linux but 2x on Windows and 10x on macOS, which makes the full
  # matrix roughly ten times the cost of this job for a result that rarely
  # differs. Platform-specific breakage still gets caught by the build job
  # on merge; this catches the ordinary kind before it reaches main.
  check:
    name: Check (Linux)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: true

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev

      - name: Download Go dependencies
        run: go mod download

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

  build:
    name: ${{ matrix.label }}
    if: github.event_name != 'pull_request'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false          # one platform failing shouldn't hide the others
      matrix:
        include:
          - os: windows-latest
            label: Windows
            artifact: Sablewright-Windows
          - os: macos-latest
            label: macOS
            artifact: Sablewright-macOS
          - os: ubuntu-22.04
            label: Linux
            artifact: Sablewright-Linux

    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: true

      # Wails needs GTK and WebKit headers to compile on Linux. Ubuntu 22.04
      # ships webkit2gtk-4.0; 24.04 only has 4.1 and needs the webkit2_41 tag.
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.10.2

      # Download, don't tidy: go.mod and go.sum are committed, so CI fetches
      # exactly the pinned versions and verifies them against the checksums
      # rather than re-resolving the dependency graph on every run.
      - name: Download Go dependencies
        run: go mod download

      # ---- Windows: a single .exe, plus an NSIS installer ----
      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: wails build -platform windows/amd64 -webview2 embed -ldflags "-w -s"

      # windows-latest is Windows Server 2025, and that image dropped the NSIS
      # that windows-2022 shipped, so makensis has to be installed explicitly.
      # Chocolatey is preinstalled on the image; winget is not present on it at
      # all (it ships with Windows 11 as an App Installer package, not with
      # Server), so choco is the only option here rather than the nicer one.
      - name: Install NSIS (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install nsis -y --no-progress
          "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Build installer (Windows)
        if: runner.os == 'Windows'
        run: wails build -platform windows/amd64 -webview2 embed -nsis -ldflags "-w -s"

      # Wails only *warns* when makensis is missing, so the step above exits 0
      # having produced nothing. That is exactly how a silently-broken
      # installer survived the whole life of this workflow, so assert on the
      # file rather than trusting the exit code.
      - name: Verify the installer exists (Windows)
        if: runner.os == 'Windows'
        run: |
          $installer = Get-ChildItem build/bin -Filter *installer*.exe -ErrorAction SilentlyContinue
          if (-not $installer) {
            throw "No NSIS installer in build/bin - is makensis on PATH?"
          }
          "Built $($installer.Name) ($([math]::Round($installer.Length / 1MB, 1)) MB)"

      # ---- macOS: a universal .app, zipped so permissions survive ----
      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: wails build -platform darwin/universal -ldflags "-w -s"

      - name: Zip the .app (macOS)
        if: runner.os == 'macOS'
        run: |
          cd build/bin
          ditto -c -k --keepParent "Sablewright.app" Sablewright-macOS.zip || \
          ditto -c -k --keepParent Sablewright.app Sablewright-macOS.zip

      # ---- Linux ----
      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: wails build -platform linux/amd64 -ldflags "-w -s"

      - name: Upload build
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: |
            build/bin/*.exe
            build/bin/*.zip
            build/bin/Sablewright
          if-no-files-found: warn
          # These are now just a hand-off to the release job, which keeps the
          # durable copy. Short retention plus the cleanup job below is what
          # keeps the 500 MB free-tier artifact quota flat.
          retention-days: 7

  # Publish the binaries to a rolling "latest" release, so there is one stable
  # place to grab a current build from instead of digging through the Actions
  # tab. Release assets also sit outside the 500 MB Actions artifact quota,
  # which is what makes the short retention above affordable.
  release:
    name: Publish latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Not merge-multiple: keeping one directory per artifact means the
      # platform is known from the path rather than guessed from a filename.
      - name: Collect the platform builds
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      # Give every asset a self-describing name. Wails names its output after
      # the app, so the Linux binary arrives as a bare "Sablewright" and sits
      # in the release next to "Sablewright.exe" telling you nothing about
      # which platform it is for.
      - name: Name the assets by platform
        run: |
          set -euo pipefail
          shopt -s nullglob
          mkdir -p release
          cp artifacts/Sablewright-Windows/Sablewright.exe     release/Sablewright-Windows.exe
          cp artifacts/Sablewright-macOS/Sablewright-macOS.zip release/Sablewright-macOS.zip
          cp artifacts/Sablewright-Linux/Sablewright           release/Sablewright-Linux
          # Wails names the installer with the arch, so match it by pattern.
          for f in artifacts/Sablewright-Windows/*installer*.exe; do
            cp "$f" release/Sablewright-Windows-installer.exe
          done
          ls -l release

      # The tag is deleted and recreated on each merge so it always points at
      # the commit the binaries were actually built from. Marked prerelease:
      # these are continuous builds off main, not tagged versions.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          gh release delete latest --repo "$REPO" --yes --cleanup-tag || true
          gh release create latest release/* \
            --repo "$REPO" \
            --target "$GITHUB_SHA" \
            --title "Latest build from main" \
            --prerelease \
            --notes "Continuous build of \`main\` at ${GITHUB_SHA:0:7}.

          Produced by [run ${GITHUB_RUN_ID}](https://github.com/${REPO}/actions/runs/${GITHUB_RUN_ID}). Replaced on every merge to main."

  # Only the newest set of binaries is worth keeping. The free tier allows
  # 500 MB of artifact storage and each run stores roughly 16 MB, so without
  # this the quota fills after about thirty merges and uploads start failing.
  #
  # This runs only after every platform succeeded, so a failed build never
  # deletes the last known-good binaries.
  cleanup:
    name: Remove superseded artifacts
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      # This is the only workflow in the repo, so "not from this run" is the
      # same as "superseded". Revisit the filter if a second one is added.
      - name: Delete artifacts from earlier runs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          gh api --paginate "repos/$REPO/actions/artifacts?per_page=100" \
            --jq ".artifacts[] | select(.workflow_run.id != $RUN_ID) | .id" \
            > stale.txt
          echo "$(wc -l < stale.txt) superseded artifact(s) to remove"
          while read -r id; do
            [ -n "$id" ] || continue
            gh api -X DELETE "repos/$REPO/actions/artifacts/$id" \
              && echo "deleted $id" \
              || echo "could not delete $id (already gone?)"
          done < stale.txt