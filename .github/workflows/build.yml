name: Build desktop apps

# Pull requests get the cheap check job; merges to main and pushed v* tags get
# the full three-platform build. Can also be started by hand from the Actions
# tab. A tag and a branch are separate refs, so tagging a commit already on main
# builds it again rather than reusing the rolling build's binaries - the same
# sources, but a set of assets that belongs to the release and is not deleted
# out from under it on the next merge.
on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Pushing twice in quick succession shouldn't leave two runs racing to
# finish: the newer commit cancels the older run rather than both burning
# minutes on a result nobody will look at.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Pull requests only compile-check on Linux. Private-repo minutes bill at
  # 1x on Linux but 2x on Windows and 10x on macOS, which makes the full
  # matrix roughly ten times the cost of this job for a result that rarely
  # differs. Platform-specific breakage still gets caught by the build job
  # on merge; this catches the ordinary kind before it reaches main.
  check:
    name: Check (Linux)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: true

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Download Go dependencies
        run: go mod download

      # The tag has to match the one the build job uses, or this checks a
      # different WebKit binding than the one that actually ships.
      - name: Build
        run: go build -tags webkit2_41 ./...

      - name: Vet
        run: go vet -tags webkit2_41 ./...

      - name: Test
        run: go test -tags webkit2_41 ./...

  build:
    name: ${{ matrix.label }}
    if: github.event_name != 'pull_request'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false          # one platform failing shouldn't hide the others
      matrix:
        include:
          - os: windows-latest
            label: Windows
            artifact: Sablewright-Windows
          - os: macos-latest
            label: macOS
            artifact: Sablewright-macOS
          - os: ubuntu-22.04
            label: Linux
            artifact: Sablewright-Linux

    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: true

      # Wails needs GTK and WebKit headers to compile on Linux. Ubuntu 22.04 is
      # still the runner because its glibc is the oldest of the images, and a
      # binary linked against an older glibc runs on newer systems but never
      # the other way round. WebKit is taken at 4.1 rather than the 4.0 that
      # 22.04 defaults to: 24.04 and Debian 13 dropped 4.0 entirely and Arch
      # only ever had 4.1, so a package built against 4.0 would be
      # uninstallable on most current systems.
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.10.2

      # One version number for everything. Wails already reads productVersion
      # out of wails.json for the Windows file properties, so making it the
      # source for the in-app version and the Linux packages too means one
      # place to bump instead of four that drift. The commit rides along
      # because every merge replaces the same rolling release: the number
      # alone cannot tell two downloads apart.
      - name: Work out the build version
        shell: bash
        run: |
          V="$(sed -n 's/.*"productVersion"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' wails.json | head -1)"
          [ -n "$V" ] || { echo "No productVersion found in wails.json"; exit 1; }
          # A release is only worth cutting if the binaries inside it agree with
          # the name on the outside. Tagging v1.2.0 while wails.json still says
          # 1.1.0 would ship packages named after the old version and an app
          # that reports it, so fail here instead of publishing the mismatch.
          if [ "${GITHUB_REF_TYPE:-}" = tag ]; then
            [ "${GITHUB_REF_NAME#v}" = "$V" ] || {
              echo "Tag $GITHUB_REF_NAME does not match productVersion $V in wails.json"
              exit 1
            }
          fi
          echo "VERSION=$V" >> "$GITHUB_ENV"
          echo "LDFLAGS=-w -s -X main.version=$V -X main.commit=${GITHUB_SHA:0:7}" >> "$GITHUB_ENV"
          echo "Building $V (${GITHUB_SHA:0:7})"

      # Download, don't tidy: go.mod and go.sum are committed, so CI fetches
      # exactly the pinned versions and verifies them against the checksums
      # rather than re-resolving the dependency graph on every run.
      - name: Download Go dependencies
        run: go mod download

      # ---- Windows: a single .exe, plus an NSIS installer ----
      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: wails build -platform windows/amd64 -webview2 embed -ldflags "${{ env.LDFLAGS }}"

      # windows-latest is Windows Server 2025, and that image dropped the NSIS
      # that windows-2022 shipped, so makensis has to be installed explicitly.
      # Chocolatey is preinstalled on the image; winget is not present on it at
      # all (it ships with Windows 11 as an App Installer package, not with
      # Server), so choco is the only option here rather than the nicer one.
      - name: Install NSIS (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install nsis -y --no-progress
          "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Build installer (Windows)
        if: runner.os == 'Windows'
        run: wails build -platform windows/amd64 -webview2 embed -nsis -ldflags "${{ env.LDFLAGS }}"

      # Wails only *warns* when makensis is missing, so the step above exits 0
      # having produced nothing. That is exactly how a silently-broken
      # installer survived the whole life of this workflow, so assert on the
      # file rather than trusting the exit code.
      - name: Verify the installer exists (Windows)
        if: runner.os == 'Windows'
        run: |
          $installer = Get-ChildItem build/bin -Filter *installer*.exe -ErrorAction SilentlyContinue
          if (-not $installer) {
            throw "No NSIS installer in build/bin - is makensis on PATH?"
          }
          "Built $($installer.Name) ($([math]::Round($installer.Length / 1MB, 1)) MB)"

      # ---- macOS: an Apple Silicon .app in a drag-to-install DMG ----
      #
      # arm64 rather than universal: Apple Silicon is the only configuration
      # this app is supported on, and a single slice halves the download.
      # The runner is already arm64, so this is a native build.
      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: wails build -platform darwin/arm64 -ldflags "${{ env.LDFLAGS }}"

      # The GPL asks that a copy travel with the binary, and the embedded paint
      # data is MIT, whose notice has to reach whoever holds a copy - so both
      # files go inside the bundle rather than only into the release.
      #
      # This has to run before the signing step. codesign seals the contents of
      # Contents/Resources, so a file added afterwards leaves the bundle with a
      # signature that no longer matches what it covers - which is the same
      # invalid-signature state, and the same "app is damaged" Gatekeeper
      # message, that the re-signing below exists to avoid.
      - name: Add the license files to the bundle (macOS)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          RES=build/bin/Sablewright.app/Contents/Resources
          cp LICENSE THIRD-PARTY-NOTICES.md "$RES/"
          ls -l "$RES/LICENSE" "$RES/THIRD-PARTY-NOTICES.md"

      # The Go linker ad-hoc signs the arm64 executable it produces, but it
      # signs a *binary*, not a bundle: nothing writes the resource seal at
      # Contents/_CodeSignature/CodeResources. codesign then reads a signature
      # that declares sealed resources next to a bundle that has none and
      # rejects it outright - "code has no resources but signature indicates
      # they must be present". That is an invalid signature rather than an
      # untrusted one, and an invalid signature is what makes Gatekeeper say
      # the download is damaged and should be moved to the Trash.
      #
      # The universal build this replaced never hit it: lipo strips the
      # linker's signature when it fuses the slices, so that bundle was
      # unsigned rather than half-signed, and unsigned only ever got the
      # ordinary unidentified-developer prompt.
      #
      # Re-signing the whole bundle writes the seal and makes the signature
      # verify. --sign - is ad-hoc, which is all that is available without a
      # paid Developer ID, so first launch still needs Open Anyway - but the
      # app is now openable at all, which it was not before. --identifier
      # matches CFBundleIdentifier so the signature does not keep the "a.out"
      # the linker had defaulted to.
      - name: Sign the app bundle (macOS)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          APP=build/bin/Sablewright.app
          codesign --force --deep --sign - \
            --identifier "$(plutil -extract CFBundleIdentifier raw "$APP/Contents/Info.plist")" \
            "$APP"
          # Assert on the verification rather than on codesign's exit code:
          # this step exists only to stop a bundle that fails --strict from
          # reaching a release again, so it has to be the thing that is checked.
          codesign --verify --deep --strict --verbose=2 "$APP"

      - name: Install create-dmg (macOS)
        if: runner.os == 'macOS'
        run: brew install create-dmg

      - name: Build the DMG (macOS)
        if: runner.os == 'macOS'
        run: |
          set -uo pipefail
          APP=build/bin/Sablewright.app
          DMG=build/bin/Sablewright-macOS.dmg

          # create-dmg images the *contents* of the folder it is given, so the
          # .app goes into a staging directory of its own rather than being
          # passed directly - otherwise the bundle is unwrapped into the image.
          # ditto rather than cp: it preserves the bundle's permissions and
          # extended attributes, which is what makes the app launchable.
          STAGE="$(mktemp -d)"
          ditto "$APP" "$STAGE/Sablewright.app"

          # Wails compiles build/appicon.png into the bundle; reuse the result
          # as the volume icon so the mounted disk isn't a blank drive.
          #
          # --volname leads the array so it is never empty: macOS ships bash
          # 3.2, where expanding an empty array trips `set -u`.
          # The `|| true` is load-bearing: with an unmatched glob ls exits 1,
          # pipefail carries that to the assignment, and the step's `bash -e`
          # would abort the build over a missing volume icon.
          OPTS=(--volname Sablewright)
          ICNS="$(ls "$APP"/Contents/Resources/*.icns 2>/dev/null | head -1 || true)"
          [ -n "$ICNS" ] && OPTS+=(--volicon "$ICNS")
          OPTS+=(--window-pos 200 120 --window-size 600 400 --icon-size 110
                 --icon Sablewright.app 150 190
                 --hide-extension Sablewright.app
                 --app-drop-link 450 190)

          # create-dmg lays the window out by driving the Finder over
          # AppleScript, which intermittently loses a race against the volume
          # it just mounted on a CI runner. That is flaky rather than broken,
          # so retry once before treating it as a real failure.
          for attempt in 1 2; do
            rm -f "$DMG"
            create-dmg "${OPTS[@]}" "$DMG" "$STAGE" && break
            echo "create-dmg attempt $attempt failed"
          done

          # Assert on the file rather than the exit code, for the same reason
          # the NSIS step above does.
          [ -f "$DMG" ] || { echo "No DMG in build/bin - create-dmg failed twice."; exit 1; }
          ls -lh "$DMG"

          # Verifying the bundle before it was imaged only proves the bundle
          # was fine. Gatekeeper judges the copy the user drags out of the
          # image, so check that one: mount the finished DMG and re-verify
          # from there. -nobrowse keeps the runner's Finder out of it, and the
          # detach is a trap so a failed verify still releases the device.
          MNT="$(mktemp -d)"
          hdiutil attach -nobrowse -readonly -mountpoint "$MNT" "$DMG"
          trap 'hdiutil detach "$MNT" -quiet || true' EXIT
          codesign --verify --deep --strict --verbose=2 "$MNT/Sablewright.app"

      # ---- Linux: a bare binary, plus .deb and Arch packages ----
      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: wails build -platform linux/amd64 -tags webkit2_41 -ldflags "${{ env.LDFLAGS }}"

      # nfpm builds both package formats from one config without root or a
      # container, and `go install` is the cheapest way to get it given Go is
      # already set up above. Pinned rather than @latest so a release upstream
      # can't change what this produces.
      - name: Install nfpm
        if: runner.os == 'Linux'
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.43.0

      - name: Package for Debian, Fedora and Arch (Linux)
        if: runner.os == 'Linux'
        run: |
          nfpm pkg -f build/linux/nfpm.yaml --packager deb       --target build/bin/
          nfpm pkg -f build/linux/nfpm.yaml --packager rpm       --target build/bin/
          nfpm pkg -f build/linux/nfpm.yaml --packager archlinux --target build/bin/

      # Same reasoning as the NSIS check: assert on the files rather than
      # trusting an exit code, so a packaging step that quietly produces
      # nothing fails here instead of shipping an incomplete release.
      - name: Verify the packages exist (Linux)
        if: runner.os == 'Linux'
        run: |
          shopt -s nullglob
          deb=(build/bin/*.deb); rpms=(build/bin/*.rpm); arch=(build/bin/*.pkg.tar.zst)
          [ ${#deb[@]} -gt 0 ]  || { echo "nfpm produced no .deb";  exit 1; }
          [ ${#rpms[@]} -gt 0 ] || { echo "nfpm produced no .rpm";  exit 1; }
          [ ${#arch[@]} -gt 0 ] || { echo "nfpm produced no Arch package"; exit 1; }
          ls -lh "${deb[@]}" "${rpms[@]}" "${arch[@]}"

          # A package whose dependencies don't resolve installs nowhere, and
          # that stays invisible until someone tries it. Printing what each
          # one actually requires puts the answer in the build log, where a
          # wrong package name is obvious rather than latent. Diagnostics
          # only, so a runner image without rpm skips it rather than failing.
          dpkg-deb --info "${deb[0]}"
          if command -v rpm >/dev/null 2>&1; then
            rpm -qp --requires "${rpms[0]}"
          else
            echo "(rpm not on this image - skipping the requires dump)"
          fi

      # The Linux packages install these to /usr/share/doc and the macOS bundle
      # carries them internally, but a bare .exe has nowhere to put a file.
      # Staging them into build/bin rides them along in every artifact so the
      # release job can publish them next to the downloads that cannot hold
      # them. Paths stay under build/bin deliberately: upload-artifact roots the
      # archive at the common ancestor of everything it is given, so a path at
      # the workspace root would push every asset down a build/bin/ prefix and
      # break the release job's copies.
      - name: Stage the license files for release
        run: cp LICENSE THIRD-PARTY-NOTICES.md build/bin/
        shell: bash

      - name: Upload build
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: |
            build/bin/*.exe
            build/bin/*.dmg
            build/bin/*.deb
            build/bin/*.rpm
            build/bin/*.pkg.tar.zst
            build/bin/Sablewright
            build/bin/LICENSE
            build/bin/THIRD-PARTY-NOTICES.md
          if-no-files-found: warn
          # These are now just a hand-off to the release job, which keeps the
          # durable copy. Short retention plus the cleanup job below is what
          # keeps the 500 MB free-tier artifact quota flat.
          retention-days: 7

  # Publishes the same binaries as one of two different things, depending on
  # what was pushed.
  #
  # A merge to main refreshes the rolling "latest" prerelease, so there is one
  # stable place to grab a current build from instead of digging through the
  # Actions tab. A pushed v* tag cuts a real, versioned release: that is what
  # the repo page shows as Latest, what /releases/latest resolves to, and what
  # stays put rather than being replaced by the next merge.
  #
  # Release assets also sit outside the 500 MB Actions artifact quota, which is
  # what makes the short retention above affordable.
  release:
    name: Publish
    needs: build
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Not merge-multiple: keeping one directory per artifact means the
      # platform is known from the path rather than guessed from a filename.
      - name: Collect the platform builds
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      # Give every asset a self-describing name. Wails names its output after
      # the app, so the Linux binary arrives as a bare "Sablewright" and sits
      # in the release next to "Sablewright.exe" telling you nothing about
      # which platform it is for.
      - name: Name the assets by platform
        run: |
          set -euo pipefail
          shopt -s nullglob
          mkdir -p release
          cp artifacts/Sablewright-Windows/Sablewright.exe     release/Sablewright-Windows.exe
          cp artifacts/Sablewright-macOS/Sablewright-macOS.dmg release/Sablewright-macOS.dmg
          cp artifacts/Sablewright-Linux/Sablewright           release/Sablewright-Linux
          # Wails names the installer with the arch, so match it by pattern.
          for f in artifacts/Sablewright-Windows/*installer*.exe; do
            cp "$f" release/Sablewright-Windows-installer.exe
          done
          # The Linux packages keep the names nfpm gave them. Those already
          # carry the version and architecture in the form each ecosystem
          # expects, and renaming them to match the pattern above would only
          # make them look wrong to the tools that consume them.
          for f in artifacts/Sablewright-Linux/*.deb \
                   artifacts/Sablewright-Linux/*.rpm \
                   artifacts/Sablewright-Linux/*.pkg.tar.zst; do
            cp "$f" release/
          done
          # Published once as their own assets, so the two Windows downloads -
          # which have nowhere internal to carry them - still arrive alongside
          # the terms they are offered under. Every artifact holds an identical
          # pair, so which platform they are taken from does not matter.
          cp artifacts/Sablewright-Windows/LICENSE                release/
          cp artifacts/Sablewright-Windows/THIRD-PARTY-NOTICES.md release/
          ls -l release

      # A versioned release. The tag is already in the repo - it is what
      # triggered this run - so there is no --target to set and nothing to
      # delete first. --generate-notes writes the changelog from the commits
      # since the previous release, and --latest is what puts the version in
      # the sidebar on the repo page.
      - name: Publish the tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" release/* \
            --repo "$REPO" \
            --title "$TAG" \
            --latest \
            --generate-notes

      # The rolling tag is deleted and recreated on each merge so it always
      # points at the commit the binaries were actually built from. Marked
      # prerelease: these are continuous builds off main, not versions anyone
      # asked for. --latest=false says the same thing a second way, so a merge
      # landing after a release can never take the Latest badge off the version
      # that earned it.
      - name: Refresh the rolling build
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          gh release delete latest --repo "$REPO" --yes --cleanup-tag || true
          gh release create latest release/* \
            --repo "$REPO" \
            --target "$GITHUB_SHA" \
            --title "Latest build from main" \
            --prerelease \
            --latest=false \
            --notes "Continuous build of \`main\` at ${GITHUB_SHA:0:7}.

          Produced by [run ${GITHUB_RUN_ID}](https://github.com/${REPO}/actions/runs/${GITHUB_RUN_ID}). Replaced on every merge to main."

  # Only the newest set of binaries is worth keeping. The free tier allows
  # 500 MB of artifact storage and each run stores roughly 16 MB, so without
  # this the quota fills after about thirty merges and uploads start failing.
  #
  # This runs only after every platform succeeded, so a failed build never
  # deletes the last known-good binaries.
  cleanup:
    name: Remove superseded artifacts
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      # This is the only workflow in the repo, so "not from this run" is the
      # same as "superseded". Revisit the filter if a second one is added.
      - name: Delete artifacts from earlier runs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          gh api --paginate "repos/$REPO/actions/artifacts?per_page=100" \
            --jq ".artifacts[] | select(.workflow_run.id != $RUN_ID) | .id" \
            > stale.txt
          echo "$(wc -l < stale.txt) superseded artifact(s) to remove"
          while read -r id; do
            [ -n "$id" ] || continue
            gh api -X DELETE "repos/$REPO/actions/artifacts/$id" \
              && echo "deleted $id" \
              || echo "could not delete $id (already gone?)"
          done < stale.txt