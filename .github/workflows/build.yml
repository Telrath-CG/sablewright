name: Build desktop apps

# Pull requests get the cheap check job; merges to main and pushed v* tags get
# the full three-platform build. Can also be started by hand from the Actions
# tab, on any branch, which builds every platform without publishing anything.
# A tag and a branch are separate refs, so tagging a commit already on main
# builds it again rather than reusing the rolling build's binaries - the same
# sources, but a set of assets that belongs to the release and is not deleted
# out from under it on the next merge.
on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Pushing twice in quick succession shouldn't leave two runs racing to
# finish: the newer commit cancels the older run rather than both burning
# minutes on a result nobody will look at.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Actions are pinned to the commit a release tag points at, not the tag: a tag
# can be moved after the fact, and this workflow publishes releases with write
# access to the repository. The comment says which release each commit is.

jobs:
  # Pull requests only compile-check on Linux. Private-repo minutes bill at
  # 1x on Linux but 2x on Windows and 10x on macOS, which makes the full
  # matrix roughly ten times the cost of this job for a result that rarely
  # differs. Platform-specific breakage still gets caught by the build job
  # on merge; this catches the ordinary kind before it reaches main.
  check:
    name: Check (Linux)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: '1.26'
          cache: true

      # Wails v3 builds against GTK 4 and WebKitGTK 6.0, which first shipped
      # in Ubuntu 24.04 - hence the runner. No build tags: v3 compiles the
      # real app as it is, so this checks what actually ships.
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-4-dev libwebkitgtk-6.0-dev

      - name: Download Go dependencies
        run: go mod download

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

  build:
    name: ${{ matrix.label }}
    if: github.event_name != 'pull_request'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false          # one platform failing shouldn't hide the others
      matrix:
        include:
          - os: windows-latest
            label: Windows
            artifact: Sablewright-Windows
          - os: macos-latest
            label: macOS
            artifact: Sablewright-macOS
          # 24.04 is the oldest image with GTK 4 and WebKitGTK 6.0, and a
          # binary linked against its glibc (2.39) runs on newer systems but
          # never older ones, so it sets the floor the packages declare.
          - os: ubuntu-24.04
            label: Linux
            artifact: Sablewright-Linux

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: '1.26'
          cache: true

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-4-dev libwebkitgtk-6.0-dev

      # The app itself is built with plain `go build`. The Wails CLI is only
      # a tool here: the Windows resources and installer bootstrapper, and
      # the macOS disk image. Pinned to the same version as the library.
      - name: Install the Wails CLI
        if: runner.os != 'Linux'
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.1.0

      # One version number for everything, read from build/config.yml: the
      # in-app version, the macOS bundle, the Windows file properties and
      # installer, and the Linux packages all get it from here. The commit
      # rides along because every merge replaces the same rolling release:
      # the number alone cannot tell two downloads apart.
      #
      # RELEASE numbers the Linux packages of rolling builds, so two builds
      # of the same version are never two different packages with the same
      # name and version. A tagged release leaves it empty and gets the
      # plain version.
      - name: Work out the build version
        shell: bash
        run: |
          V="$(awk '/^info:/{f=1;next} /^[^[:space:]#]/{f=0}
                    f && $1=="version:"{v=$2; gsub(/"/,"",v); print v; exit}' build/config.yml)"
          [ -n "$V" ] || { echo "No info.version found in build/config.yml"; exit 1; }
          # A release is only worth cutting if the binaries inside it agree with
          # the name on the outside. Tagging v2.1.0 while build/config.yml still
          # says 2.0.0 would ship packages named after the old version and an
          # app that reports it, so fail here instead of publishing the mismatch.
          if [ "${GITHUB_REF_TYPE:-}" = tag ]; then
            [ "${GITHUB_REF_NAME#v}" = "$V" ] || {
              echo "Tag $GITHUB_REF_NAME does not match info.version $V in build/config.yml"
              exit 1
            }
            echo "RELEASE=" >> "$GITHUB_ENV"
          else
            echo "RELEASE=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          fi
          echo "VERSION=$V" >> "$GITHUB_ENV"
          echo "LDFLAGS=-w -s -X main.version=$V -X main.commit=${GITHUB_SHA:0:7}" >> "$GITHUB_ENV"
          echo "Building $V (${GITHUB_SHA:0:7})"

      # Download, don't tidy: go.mod and go.sum are committed, so CI fetches
      # exactly the pinned versions and verifies them against the checksums
      # rather than re-resolving the dependency graph on every run.
      - name: Download Go dependencies
        run: go mod download

      # Every platform, every build: the pull request check only covers
      # Linux, and a release should never be the first time the tests run
      # on Windows or macOS.
      - name: Test
        run: go test ./...

      # ---- Windows: a single .exe, plus an NSIS installer ----
      #
      # The .syso carries the icon, the file properties and the manifest into
      # the .exe. The manifest is not optional: it opts into version 6 of the
      # common controls, which is what lets the confirm dialogs show their own
      # button labels instead of a fixed Yes and No.
      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: bash
        env:
          CGO_ENABLED: '0'
        run: |
          set -euo pipefail
          mkdir -p build/bin
          sed -i "s/0\.0\.0/$VERSION/g" build/windows/info.json
          wails3 generate syso -arch amd64 -icon build/windows/icon.ico \
            -manifest build/windows/wails.exe.manifest -info build/windows/info.json \
            -out wails_windows_amd64.syso
          go build -tags production -trimpath -buildvcs=false \
            -ldflags "$LDFLAGS -H windowsgui" -o build/bin/Sablewright.exe .

      # windows-latest is Windows Server 2025, and that image dropped the NSIS
      # that windows-2022 shipped, so makensis has to be installed explicitly.
      # Chocolatey is preinstalled on the image; winget is not present on it at
      # all (it ships with Windows 11 as an App Installer package, not with
      # Server), so choco is the only option here rather than the nicer one.
      - name: Install NSIS (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install nsis -y --no-progress
          "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      # The installer carries Microsoft's WebView2 bootstrapper and runs it on
      # a PC that lacks the runtime. The bare .exe has no equivalent in Wails
      # v3, so it needs WebView2 already installed - which Windows 11 always
      # has. makensis runs from the script's own folder, so the paths inside
      # project.nsi are relative to build/windows/nsis.
      - name: Build installer (Windows)
        if: runner.os == 'Windows'
        run: |
          wails3 generate webview2bootstrapper -dir build/windows/nsis
          makensis "-DARG_WAILS_AMD64_BINARY=$PWD\build\bin\Sablewright.exe" "-DINFO_PRODUCTVERSION=$env:VERSION" build\windows\nsis\project.nsi
          if ($LASTEXITCODE -ne 0) { throw "makensis failed" }

      # Assert on the file rather than trusting an exit code: that is how a
      # silently-broken installer once survived the whole life of this
      # workflow.
      - name: Verify the installer exists (Windows)
        if: runner.os == 'Windows'
        run: |
          $installer = Get-ChildItem build/bin -Filter *installer*.exe -ErrorAction SilentlyContinue
          if (-not $installer) {
            throw "No NSIS installer in build/bin"
          }
          "Built $($installer.Name) ($([math]::Round($installer.Length / 1MB, 1)) MB)"

      # ---- macOS: an Apple Silicon .app in a drag-to-install DMG ----
      #
      # arm64 rather than universal: Apple Silicon is the only configuration
      # this app is supported on, and a single slice halves the download.
      # The runner is already arm64, so this is a native build. 12.0 is the
      # oldest macOS Wails v3 supports.
      - name: Build (macOS)
        if: runner.os == 'macOS'
        env:
          CGO_ENABLED: '1'
          MACOSX_DEPLOYMENT_TARGET: '12.0'
          CGO_CFLAGS: -mmacosx-version-min=12.0
          CGO_LDFLAGS: -mmacosx-version-min=12.0
        run: |
          mkdir -p build/bin
          go build -tags production -trimpath -buildvcs=false \
            -ldflags "$LDFLAGS" -o build/bin/Sablewright .

      # The bundle is put together by hand: the binary, the Info.plist with
      # this build's version stamped in, and the icon. The GPL asks that a
      # copy travel with the binary, and the embedded paint data is MIT, whose
      # notice has to reach whoever holds a copy - so both license files go
      # inside the bundle rather than only into the release.
      #
      # Everything goes in before signing. codesign seals the contents of
      # Contents/Resources, and a file added afterwards leaves a signature
      # that no longer matches - the invalid-signature state that makes
      # Gatekeeper call the download damaged.
      #
      # --sign - is ad-hoc, which is all that is available without a paid
      # Developer ID, so first launch still needs Open Anyway. --identifier
      # matches CFBundleIdentifier so the signature does not keep the "a.out"
      # the linker defaults to.
      - name: Assemble and sign the app bundle (macOS)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          APP=build/bin/Sablewright.app
          rm -rf "$APP"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          mv build/bin/Sablewright "$APP/Contents/MacOS/Sablewright"
          cp build/darwin/Info.plist "$APP/Contents/Info.plist"
          plutil -replace CFBundleShortVersionString -string "$VERSION" "$APP/Contents/Info.plist"
          plutil -replace CFBundleVersion -string "$VERSION" "$APP/Contents/Info.plist"
          cp build/darwin/icons.icns LICENSE THIRD-PARTY-NOTICES.md "$APP/Contents/Resources/"
          codesign --force --deep --sign - \
            --identifier "$(plutil -extract CFBundleIdentifier raw "$APP/Contents/Info.plist")" \
            "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"

      # wails3 builds the image with hdiutil alone - no Finder scripting, so
      # none of the race create-dmg used to lose on CI runners. It picks up
      # build/bin/Sablewright.app and writes build/bin/Sablewright.dmg, with
      # an Applications link to drag onto.
      #
      # Verifying the bundle before it was imaged only proves the bundle was
      # fine. Gatekeeper judges the copy dragged out of the image, so the
      # finished DMG is mounted and that copy verified too.
      - name: Build the DMG (macOS)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          wails3 tool package --format dmg --name Sablewright --out build/bin
          DMG=build/bin/Sablewright.dmg
          [ -f "$DMG" ] || { echo "No DMG in build/bin"; exit 1; }
          ls -lh "$DMG"
          MNT="$(mktemp -d)"
          hdiutil attach -nobrowse -readonly -mountpoint "$MNT" "$DMG"
          trap 'hdiutil detach "$MNT" -quiet || true' EXIT
          codesign --verify --deep --strict --verbose=2 "$MNT/Sablewright.app"
          # The bundle is now inside the image; leaving the loose copy out of
          # the artifact keeps the upload to what is published.
          rm -rf build/bin/Sablewright.app

      # ---- Linux: a bare binary, plus .deb, .rpm and Arch packages ----
      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p build/bin
          go build -tags production -trimpath -buildvcs=false \
            -ldflags "$LDFLAGS" -o build/bin/Sablewright .

      # nfpm builds all three package formats from one config without root or
      # a container, and `go install` is the cheapest way to get it given Go
      # is already set up above. Pinned rather than @latest so a release
      # upstream can't change what this produces.
      - name: Install nfpm
        if: runner.os == 'Linux'
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.43.0

      - name: Package for Debian, Fedora and Arch (Linux)
        if: runner.os == 'Linux'
        run: |
          nfpm pkg -f build/linux/nfpm.yaml --packager deb       --target build/bin/
          nfpm pkg -f build/linux/nfpm.yaml --packager rpm       --target build/bin/
          nfpm pkg -f build/linux/nfpm.yaml --packager archlinux --target build/bin/

      # Same reasoning as the installer check: assert on the files rather than
      # trusting an exit code. Then install the .deb on this runner - the
      # oldest system the packages support - so a dependency named wrong fails
      # the build here instead of failing on someone's machine.
      - name: Verify the packages (Linux)
        if: runner.os == 'Linux'
        run: |
          shopt -s nullglob
          deb=(build/bin/*.deb); rpms=(build/bin/*.rpm); arch=(build/bin/*.pkg.tar.zst)
          [ ${#deb[@]} -gt 0 ]  || { echo "nfpm produced no .deb";  exit 1; }
          [ ${#rpms[@]} -gt 0 ] || { echo "nfpm produced no .rpm";  exit 1; }
          [ ${#arch[@]} -gt 0 ] || { echo "nfpm produced no Arch package"; exit 1; }
          ls -lh "${deb[@]}" "${rpms[@]}" "${arch[@]}"
          dpkg-deb --info "${deb[0]}"
          if command -v rpm >/dev/null 2>&1; then
            rpm -qp --requires "${rpms[0]}"
          else
            echo "(rpm not on this image - skipping the requires dump)"
          fi
          sudo apt-get install -y "./${deb[0]}"
          dpkg -s sablewright | head -5
          sudo apt-get remove -y sablewright

      # The Linux packages install these to /usr/share/doc and the macOS bundle
      # carries them internally, but a bare .exe has nowhere to put a file.
      # Staging them into build/bin rides them along in every artifact so the
      # release job can publish them next to the downloads that cannot hold
      # them. Paths stay under build/bin deliberately: upload-artifact roots the
      # archive at the common ancestor of everything it is given, so a path at
      # the workspace root would push every asset down a build/bin/ prefix and
      # break the release job's copies.
      - name: Stage the license files for release
        run: cp LICENSE THIRD-PARTY-NOTICES.md build/bin/
        shell: bash

      - name: Upload build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.artifact }}
          path: |
            build/bin/*.exe
            build/bin/*.dmg
            build/bin/*.deb
            build/bin/*.rpm
            build/bin/*.pkg.tar.zst
            build/bin/Sablewright
            build/bin/LICENSE
            build/bin/THIRD-PARTY-NOTICES.md
          if-no-files-found: error
          # These are now just a hand-off to the release job, which keeps the
          # durable copy. Short retention plus the cleanup job below is what
          # keeps the 500 MB free-tier artifact quota flat.
          retention-days: 7

  # Publishes the same binaries as one of two different things, depending on
  # what was pushed.
  #
  # A merge to main refreshes the rolling "latest" prerelease, so there is one
  # stable place to grab a current build from instead of digging through the
  # Actions tab. A pushed v* tag cuts a real, versioned release: that is what
  # the repo page shows as Latest, what /releases/latest resolves to, and what
  # stays put rather than being replaced by the next merge.
  #
  # Release assets also sit outside the 500 MB Actions artifact quota, which is
  # what makes the short retention above affordable.
  release:
    name: Publish
    needs: build
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      # Not merge-multiple: keeping one directory per artifact means the
      # platform is known from the path rather than guessed from a filename.
      - name: Collect the platform builds
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts

      # Give every asset a self-describing name. The builds are named after
      # the app, so the Linux binary arrives as a bare "Sablewright" and would
      # sit in the release next to "Sablewright.exe" telling you nothing
      # about which platform it is for.
      - name: Name the assets by platform
        run: |
          set -euo pipefail
          shopt -s nullglob
          mkdir -p release
          cp artifacts/Sablewright-Windows/Sablewright.exe  release/Sablewright-Windows.exe
          cp artifacts/Sablewright-macOS/Sablewright.dmg    release/Sablewright-macOS.dmg
          cp artifacts/Sablewright-Linux/Sablewright        release/Sablewright-Linux
          # The installer is named with the arch, so match it by pattern.
          for f in artifacts/Sablewright-Windows/*installer*.exe; do
            cp "$f" release/Sablewright-Windows-installer.exe
          done
          # The Linux packages keep the names nfpm gave them. Those already
          # carry the version and architecture in the form each ecosystem
          # expects, and renaming them to match the pattern above would only
          # make them look wrong to the tools that consume them.
          for f in artifacts/Sablewright-Linux/*.deb \
                   artifacts/Sablewright-Linux/*.rpm \
                   artifacts/Sablewright-Linux/*.pkg.tar.zst; do
            cp "$f" release/
          done
          # Published once as their own assets, so the two Windows downloads -
          # which have nowhere internal to carry them - still arrive alongside
          # the terms they are offered under. Every artifact holds an identical
          # pair, so which platform they are taken from does not matter.
          cp artifacts/Sablewright-Windows/LICENSE                release/
          cp artifacts/Sablewright-Windows/THIRD-PARTY-NOTICES.md release/
          ls -l release

      # A versioned release. The tag is already in the repo - it is what
      # triggered this run - so there is no --target to set and nothing to
      # delete first. --generate-notes writes the changelog from the commits
      # since the previous release, and --latest is what puts the version in
      # the sidebar on the repo page.
      - name: Publish the tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" release/* \
            --repo "$REPO" \
            --title "$TAG" \
            --latest \
            --generate-notes

      # The rolling tag is deleted and recreated on each merge so it always
      # points at the commit the binaries were actually built from. Marked
      # prerelease: these are continuous builds off main, not versions anyone
      # asked for. --latest=false says the same thing a second way, so a merge
      # landing after a release can never take the Latest badge off the version
      # that earned it.
      - name: Refresh the rolling build
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          gh release delete latest --repo "$REPO" --yes --cleanup-tag || true
          gh release create latest release/* \
            --repo "$REPO" \
            --target "$GITHUB_SHA" \
            --title "Latest build from main" \
            --prerelease \
            --latest=false \
            --notes "Continuous build of \`main\` at ${GITHUB_SHA:0:7}.

          Produced by [run ${GITHUB_RUN_ID}](https://github.com/${REPO}/actions/runs/${GITHUB_RUN_ID}). Replaced on every merge to main."

  # Only the newest set of binaries for each branch or tag is worth keeping.
  # The free tier allows 500 MB of artifact storage and each run stores
  # roughly 16 MB, so without this the quota fills after about thirty merges
  # and uploads start failing.
  #
  # This runs only after every platform succeeded, so a failed build never
  # deletes the last known-good binaries.
  cleanup:
    name: Remove superseded artifacts
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
    steps:
      # Only artifacts from earlier runs of this same branch or tag are
      # superseded. A run for another ref - a tag pushed while main was
      # building, say - may still have a release job waiting to download its
      # artifacts, so those are left to expire on their own instead. Runs of
      # the same ref never overlap: the concurrency group cancels the older.
      - name: Delete artifacts from earlier runs of this ref
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          gh api --paginate "repos/$REPO/actions/artifacts?per_page=100" \
            --jq ".artifacts[]
                  | select(.workflow_run.id != $RUN_ID and .workflow_run.head_branch == \"$REF_NAME\")
                  | .id" \
            > stale.txt
          echo "$(wc -l < stale.txt) superseded artifact(s) to remove"
          while read -r id; do
            [ -n "$id" ] || continue
            gh api -X DELETE "repos/$REPO/actions/artifacts/$id" \
              && echo "deleted $id" \
              || echo "could not delete $id (already gone?)"
          done < stale.txt
