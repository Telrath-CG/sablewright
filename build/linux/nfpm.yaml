# Package definition for the Linux .deb and Arch builds.
#
# Wails v2 has no packaging target of its own, so nfpm wraps the binary it
# already produced: one config, both formats, no root and no containers.
#
# ${VERSION} is exported by the build workflow, which reads it out of
# wails.json - the same number the app reports through App.Version - so a
# package can never claim a version the binary inside it disagrees with.
name: sablewright
arch: amd64
platform: linux
version: ${VERSION}
version_schema: semver
section: utils
priority: optional
maintainer: Telrath
homepage: https://github.com/Telrath-CG/sablewright
license: GPL-3.0-only
description: |
  Track your miniature painting projects.
  Records what stage each miniature is at, the paints used, a dated log of
  every painting session, technique recipes and progress photos. Everything is
  stored locally as JSON; the app makes no network connections.

contents:
  - src: ./build/bin/Sablewright
    dst: /usr/bin/sablewright
    file_info:
      mode: 0755

  # Without a desktop entry the app installs but never appears in the
  # application menu, leaving a binary only reachable from a terminal.
  - src: ./build/linux/sablewright.desktop
    dst: /usr/share/applications/sablewright.desktop

  # The SVG is the one that scales to whatever size a desktop asks for.
  # appicon.png is 1024px, which hicolor has no bucket for, so it goes to the
  # legacy pixmaps directory - still consulted by desktops that pass over
  # scalable icons, and free to be any size.
  - src: ./build/icon.svg
    dst: /usr/share/icons/hicolor/scalable/apps/sablewright.svg
  - src: ./build/appicon.png
    dst: /usr/share/pixmaps/sablewright.png

  # Both licenses ship with the package rather than only living in the repo.
  # The GPL asks that a copy travel with the binary, and the embedded paint
  # data is MIT, whose notice has to reach whoever holds a copy - neither is
  # satisfied by a file a package installer never sees.
  - src: ./LICENSE
    dst: /usr/share/doc/sablewright/LICENSE
  - src: ./THIRD-PARTY-NOTICES.md
    dst: /usr/share/doc/sablewright/THIRD-PARTY-NOTICES.md

overrides:
  deb:
    depends:
      # The binary is built on Ubuntu 22.04, so glibc 2.35 is the floor.
      # nfpm doesn't run shlibdeps, so nothing works this out on its own:
      # without it the package installs happily on Debian 11 and then dies at
      # launch with a linker error, instead of apt refusing it up front.
      - libc6 (>= 2.35)
      # Ubuntu 24.04's 64-bit time_t transition renamed libgtk-3-0 to
      # libgtk-3-0t64. The replacement does declare Provides: libgtk-3-0, but
      # spelling the alternative out says so plainly rather than depending on
      # a reader knowing that.
      - libgtk-3-0 | libgtk-3-0t64
      - libwebkit2gtk-4.1-0
  rpm:
    # Sonames rather than package names, because the names disagree across
    # the RPM distributions: Fedora calls the WebKit package webkit2gtk4.1
    # and openSUSE calls it libwebkit2gtk-4_1-0. Both provide the same
    # soname, which is what rpm actually resolves against and what rpmbuild
    # would have generated here by itself. The glibc floor comes free with
    # that, expressed as the symbol version it needs.
    depends:
      - "libgtk-3.so.0()(64bit)"
      - "libwebkit2gtk-4.1.so.0()(64bit)"
      - "libc.so.6(GLIBC_2.35)(64bit)"
  archlinux:
    # No glibc floor here: Arch is a rolling release, so its glibc is never
    # older than the one this was built against.
    depends:
      - gtk3
      - webkit2gtk-4.1
