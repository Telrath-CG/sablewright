<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- Declare the schemes explicitly. Without this the system webview treats
       the page as scheme-unaware and, when the OS is in dark mode, applies
       its own auto-darkening filter - which turns every white panel grey.
       The app ships both palettes, so it claims both. -->
  <meta name="color-scheme" content="light dark" />
  <title>Sablewright</title>

  <!-- Set the theme before the stylesheet paints. Doing this from app.js
       instead would show a flash of the light palette on every launch, since
       that runs at the end of the body. Falls back to the OS preference when
       the user has never chosen, and stays silent if storage is unavailable. -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem("sablewright.theme");
        if (t !== "light" && t !== "dark") {
          t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        document.documentElement.setAttribute("data-theme", t);
      } catch (e) { /* no storage: the CSS media query still applies */ }
    })();
  </script>

  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <nav class="sidebar">
      <div class="brand">
        <!-- A simplified cousin of build/icon.svg, not that file scaled down:
             the app icon is drawn for 512px and its inner border, blade facets
             and ferrule bands turn to mush at 30. Same shield geometry and the
             same palette, reduced to the two marks that survive the size. The
             sidebar is dark in both themes, so these colors are fixed. -->
        <svg viewBox="0 0 32 32" width="30" height="30" aria-hidden="true">
          <path d="M6.9,6.3 L25.1,6.3 L25.1,16.6 C25.1,22 20.6,25.4 16,27.4
                   C11.4,25.4 6.9,22 6.9,16.6 Z"
                fill="none" stroke="#e9e6e1" stroke-width="2.2" stroke-linejoin="round"/>
          <path d="M12.4,12.2 L19.6,19.6" stroke="#b9bec4" stroke-width="2.6" stroke-linecap="round"/>
          <path d="M19.6,12.2 L12.4,19.6" stroke="#e0a82e" stroke-width="2.6" stroke-linecap="round"/>
        </svg>
        <div class="brand-text"><span>Sable</span><span class="accent">Wright</span></div>
      </div>

      <ul class="nav" id="nav">
        <li data-screen="dashboard" class="active"><i>■</i><span>Dashboard</span></li>
        <li data-screen="models"><i>▤</i><span>Models</span></li>
        <li data-screen="paints"><i>●</i><span>Paint Inventory</span></li>
        <li data-screen="tips"><i>✎</i><span>Technique Tips</span></li>
      </ul>

      <div class="nav-footer">
        <button id="btn-theme"><i>◐</i><span>Dark mode</span></button>
        <button id="btn-backup"><i>↓</i><span>Backup data</span></button>
        <button id="btn-restore"><i>↑</i><span>Import backup</span></button>
        <button id="btn-folder"><i>⚙</i><span>Data folder</span></button>
        <div class="version">v1.0</div>
      </div>
    </nav>

    <main class="content" id="content"></main>
  </div>

  <div class="modal-backdrop" id="modal-backdrop" hidden>
    <div class="modal" id="modal" role="dialog" aria-modal="true"></div>
  </div>

  <div class="toast" id="toast" hidden></div>

  <script src="app.js"></script>
</body>
</html>
