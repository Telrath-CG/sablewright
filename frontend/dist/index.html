<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- Declare the schemes explicitly. Without this the system webview treats
       the page as scheme-unaware and, when the OS is in dark mode, applies
       its own auto-darkening filter - which turns every white panel grey.
       The app ships both palettes, so it claims both. -->
  <meta name="color-scheme" content="light dark" />
  <!-- What the page may load, and from where. Everything comes from the app
       itself: no request leaves the machine, no inline or injected script
       runs, and no page can be framed in - frames being the one route Wails
       does not guard on Linux. Inline style attributes stay allowed because
       app.js's templates use them; the data: images are the icons in
       style.css. -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'" />
  <title>Sablewright</title>

  <!-- Before the stylesheet, so the first paint is already in the right theme. -->
  <script src="theme.js"></script>

  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <nav class="sidebar">
      <div class="brand">
        <!-- A simplified cousin of build/icon.svg, not that file scaled down:
             the app icon is drawn for 512px and its inner border, blade facets
             and ferrule bands turn to mush at 30. Same shield geometry and the
             same palette, reduced to the two marks that survive the size. The
             sidebar is dark in both themes, so these colors are fixed. -->
        <svg viewBox="0 0 32 32" width="30" height="30" aria-hidden="true">
          <path d="M6.9,6.3 L25.1,6.3 L25.1,16.6 C25.1,22 20.6,25.4 16,27.4
                   C11.4,25.4 6.9,22 6.9,16.6 Z"
                fill="none" stroke="#e9e6e1" stroke-width="2.2" stroke-linejoin="round"/>
          <path d="M12.4,12.2 L19.6,19.6" stroke="#b9bec4" stroke-width="2.6" stroke-linecap="round"/>
          <path d="M19.6,12.2 L12.4,19.6" stroke="#e0a82e" stroke-width="2.6" stroke-linecap="round"/>
        </svg>
        <div class="brand-text"><span>Sable</span><span class="accent">wright</span></div>
      </div>

      <ul class="nav" id="nav">
        <!-- Focusable and announced as buttons, so the screens can be reached
             from the keyboard; app.js answers Enter and Space on them. -->
        <li data-screen="dashboard" class="active" tabindex="0" role="button" aria-current="page"><i aria-hidden="true">■</i><span>Dashboard</span></li>
        <li data-screen="models" tabindex="0" role="button"><i aria-hidden="true">▤</i><span>Models</span></li>
        <li data-screen="projects" tabindex="0" role="button"><i aria-hidden="true">⌸</i><span>Projects</span></li>
        <li data-screen="paints" tabindex="0" role="button"><i aria-hidden="true">●</i><span>Paint Inventory</span></li>
        <li data-screen="wishlist" tabindex="0" role="button"><i aria-hidden="true">★</i><span>Wishlist</span></li>
        <li data-screen="tips" tabindex="0" role="button"><i aria-hidden="true">✎</i><span>Technique Notes</span></li>
        <li data-screen="time" tabindex="0" role="button"><i aria-hidden="true">◷</i><span>Time at the Desk</span></li>
      </ul>

      <div class="nav-footer">
        <!-- The running session timer. It sits in the sidebar so it stays put
             while you move around the app; app.js fills it in and hides it
             again when nothing is running. -->
        <div class="timer" id="timer" hidden></div>
        <button id="btn-theme"><i>◐</i><span>Dark mode</span></button>
        <button id="btn-backup"><i>↓</i><span>Backup data</span></button>
        <button id="btn-restore"><i>↑</i><span>Import backup</span></button>
        <button id="btn-folder"><i>⚙</i><span>Data folder</span></button>
        <!-- Filled in from the binary itself; see App.Version in app.go. -->
        <div class="version" id="version"></div>
      </div>
    </nav>

    <main class="content" id="content"></main>
  </div>

  <div class="modal-backdrop" id="modal-backdrop" hidden>
    <div class="modal" id="modal" role="dialog" aria-modal="true"></div>
  </div>

  <div class="toast" id="toast" hidden></div>
  <!-- What the toast says, read out by a screen reader. A separate element
       because the toast is hidden between messages, and a change inside a
       hidden element often isn't announced. -->
  <div class="sr-only" id="announce" role="status" aria-live="polite"></div>

  <!-- The Wails runtime is served by the app but not injected into the page,
       so it is loaded here; it defines window.wails, which app.js waits for. -->
  <script type="module" src="/wails/runtime.js"></script>
  <script src="app.js"></script>
</body>
</html>
